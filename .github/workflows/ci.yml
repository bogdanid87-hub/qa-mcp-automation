name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  functional:
    name: Functional tests (Chromium)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run functional test suite
        # Playwright tests hit the live site directly — no Claude API needed.
        # ANTHROPIC_API_KEY is only required for generation tools (npm run fix, generate, etc.)
        run: npm test
        env:
          CI: true

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: Visual regression tests
    runs-on: ubuntu-latest
    # Only run visual tests when Linux baselines exist.
    # Run update-visual-baselines.yml first if this step fails with
    # "snapshot doesn't exist" errors.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run visual regression tests
        # Compares screenshots against committed -linux.png baselines.
        # If this fails with "snapshot doesn't exist", run the
        # update-visual-baselines workflow first to generate Linux baselines.
        run: npm run test:visual
        env:
          CI: true

      - name: Upload visual diff report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: playwright-report/
          retention-days: 7
