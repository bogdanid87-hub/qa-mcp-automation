name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast structural checks — no live site, no API keys needed ────────────────
  # Playwright tests run via the Husky pre-push hook on the developer's machine
  # (residential IP) before the branch is pushed. By the time a PR is opened,
  # the full test suite has already been validated locally.
  type-check:
    name: TypeScript + MCP schema validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compilation check
        run: npx tsc --noEmit

      - name: Validate MCP tool exports
        run: npx tsx scripts/validate-mcp.ts

      - name: Unit tests
        run: npm run test:unit

  # ── Visual regression — browser-based, no API calls, separate runner ─────────
  visual:
    name: Visual regression tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run visual regression tests
        id: visual_tests
        run: npm run test:visual
        continue-on-error: true
        env:
          CI: true

      - name: Generate missing Linux baselines (main push only)
        if: steps.visual_tests.outcome == 'failure' && github.event_name == 'push'
        run: npm run test:update-snapshots

      - name: Commit generated baselines
        if: steps.visual_tests.outcome == 'failure' && github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual/
          if git diff --staged --quiet; then
            echo "No new baselines generated — visual failure was not a missing-baseline issue."
            exit 1
          else
            git commit -m "chore: generate Linux visual baselines [skip ci]"
            git push --no-verify origin HEAD:${{ github.ref_name }}
          fi

      - name: Re-run visual tests against new baselines
        if: steps.visual_tests.outcome == 'failure' && github.event_name == 'push'
        run: npm run test:visual
        env:
          CI: true

      - name: Upload visual diff report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: playwright-report/
          retention-days: 7
