name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch when a new push arrives.
# Prevents queued runs from executing against stale code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional:
    name: Functional tests (Chromium)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run functional test suite
        # Playwright tests hit the live site directly — no Claude API needed.
        # ANTHROPIC_API_KEY is only required for generation tools (npm run fix, generate, etc.)
        run: npm test
        env:
          CI: true

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: Visual regression tests
    runs-on: ubuntu-latest
    # write permission needed so the self-healing step can commit and push
    # Linux baselines on the first run.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run visual regression tests
        id: visual_tests
        # First run: no Linux baselines exist → fails with "snapshot doesn't exist"
        # Subsequent runs: compares against committed baselines
        run: npm run test:visual
        continue-on-error: true
        env:
          CI: true

      - name: Generate missing Linux baselines (main push only)
        # Self-healing only runs on direct pushes to main — not on PRs.
        # On PRs a visual failure means a genuine regression that should block merge.
        # On main it most likely means baselines don't exist yet for the Linux runner.
        if: steps.visual_tests.outcome == 'failure' && github.event_name == 'push'
        run: npm run test:update-snapshots

      - name: Commit generated baselines
        if: steps.visual_tests.outcome == 'failure' && github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual/
          if git diff --staged --quiet; then
            echo "No new baselines generated — visual failure was not a missing-baseline issue."
            exit 1
          else
            git commit -m "chore: generate Linux visual baselines [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Re-run visual tests against new baselines
        if: steps.visual_tests.outcome == 'failure' && github.event_name == 'push'
        run: npm run test:visual
        env:
          CI: true

      - name: Upload visual diff report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: playwright-report/
          retention-days: 7
